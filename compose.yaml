services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: runlater
      POSTGRES_USER: runlater
      POSTGRES_PASSWORD: runlater
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runlater -d runlater"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
